<!DOCTYPE html>
<html>
     <head>
        <meta charset="UTF-8">
        <title>A.L_admin_lista_utenti_registrati</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
            </div>
            </div>
        </header>
        <main class="bg-light d-flex align-items-center" style="min-height: 85vh;">
            
            <div class="container-fluid">
                <div class="row w-100">
                    
                    <div class="col-md-6 mb-4 px-5">
                        <h4 class="mt-4 mb-4 fw-bold text-petrolio">Richieste in Sospeso</h4>
                        
                        <div id="lista-utenti-base">
                            </div>
                    </div>
                    
                    <div class="col-md-6 mb-4 d-flex align-items-center justify-content-center">
                        
                        <div id="lista-dati-utente" class="bg-white shadow w-100 p-4 mx-4" style="border-radius: 20px;">
                            <p class="text-center text-muted m-0">Seleziona un utente a sinistra per vederne i dettagli.</p>
                        </div>
                        
                    </div>
                    
                </div>
            </div>

        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>
        
        function visualizzaUtente(username) {
            const dati = new FormData();
            dati.append('username', username);

            fetch('get_dettagli_utente.php', {
                method: 'POST',
                body: dati
            })
            .then(response => response.json())
            .then(data => {
                
                if (data.successo === true) {
                    const contenitoreDati = document.getElementById('lista-dati-utente');
                    
                    contenitoreDati.innerHTML = `
                    <h4 class="mb-4 fw-bold text-petrolio">Profilo: ${data.username}</h4>
                    <div class="text-start fs-5">
                        <p><strong>Email:</strong> ${data.indirizzo_email}</p>
                        <p><strong>Codice Fiscale:</strong> ${data.cf}</p>
                        <p><strong>Data nascita:</strong> ${data.data_nascita}</p>
                        <p><strong>Luogo nascita:</strong> ${data.luogo_nascita}</p>
                        <p><strong>Professione:</strong> ${data.professione}</p>
                        <div class="text-center mt-4">
                            <button type="button" class="btn btn-petrolio btn-lg rounded-pill px-5" onclick="accettaUtente('${data.username}', '${data.professione}')">
                                Accetta Utente
                            </button>
                        </div>
                    </div>
                `;
                } else {
                    alert("Errore: " + data.messaggio);
                }
            })
            .catch(error => console.error('Errore JS:', error));
        }

        fetch('get_utenti.php')
    .then(res => res.json())
    .then(utenti => {
        const listaInAttesa = document.getElementById('lista-utenti-base');
        if (utenti.length === 0) {
            listaInAttesa.innerHTML = "<p class='text-muted'>Nessuna richiesta in attesa.</p>";
            return;
        }
        
        listaInAttesa.innerHTML = utenti.map(u => `
            <div class="card mb-2 p-3 shadow-sm border-warning text-start" style="border-radius: 20px;">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="ms-2 me-3"> 
                        <strong class="fs-5">${u.username}</strong>
                        <p class="mb-0 mt-1 text-muted">Richiesta ruolo: ${u.professione}</p>
                    </div>
                    
                    <button type="button" class="btn btn-petrolio btn-sm rounded-pill px-3 py-1 text-nowrap" onclick="visualizzaUtente('${u.username}')">
                        Visualizza Dati
                    </button>
                </div>
            </div>
        `).join('');
    })
    .catch(error => console.error('Errore Lista 1:', error));

        function accettaUtente(username, professione) {
            if (confirm(`Sei sicuro di voler accettare l'utente ${username} come ${professione}?`)) {
                
                const dati = new FormData();
                dati.append('username', username);
                dati.append('professione', professione); 

                fetch('accetta_utente.php', {
                    method: 'POST', 
                    body: dati
                })
                .then(res => res.json()) 
                .then(risposta => {

                    if (risposta.successo === true) {
                        alert(risposta.messaggio); 
                        location.reload(); 
                    } else {
                        alert(risposta.messaggio); 
                    }
                })
                .catch(error => console.error('Errore durante l\'accettazione:', error));
            }
        }
        </script>
    </body>
</html>
