<!DOCTYPE html>
<html>
     <head>
        <meta charset="UTF-8">
        <title>A.L_responsabile</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
            </div>
        </header>
        <main class="align-items-center text-center">
            <h3 class="mt-3">Inserisci i valori degli Indicatori ESG per ogni singola Voce Contabile</h3>
            <div id="container-bilancio">
    
                <form id="formBilancio" action="aggiungi_valore_indicatore.php" method="POST">
                    <div class="d-flex justify-content-center align-items-center mt-4 mb-4">
                        <label for="partita_iva" class="me-2">Partita IVA Azienda:</label>
                        <input type="text" id="partita_iva" name="partita_iva" class="form-control bg-light border-1 rounded-pill" style="max-width: 200px;" required>
                        
                        <label for="id_bilancio" class="me-2 ms-3">Id Bilancio:</label>
                        <input type="text" id="id_bilancio" name="id_bilancio" class="form-control bg-light border-1 rounded-pill" style="max-width: 200px;" required>
                    </div>

                    <div class="row w-100 justify-content-evenly align-items-start mt-5">

                        <div class="col mb-4" style="max-width: 1000px;">
                            <h5>Lista Voci Contabili</h5>
                            <div id="lista-voci">

                            </div>
                            <button type="submit" class="btn btn-dark btn-lg w-25 d-block mx-auto rounded-pill fw-bold mt-4">Inserisci Valori</button>
                        </div>

                        <div class="col-md-5 mb-4" style="max-width: 300px;">
                            <h5>Leggenda degli Indicatori ESG</h5>
                            <div id="lista-indicatori">

                            </div>
                        </div>
                    </div>
                </form>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            Promise.all([
                fetch('get_voci_contabili.php').then(res => res.json()),
                fetch('get_indicatori.php').then(res => res.json())
            ])
            .then(([voci, indicatori]) => {
                const listaVoci = document.getElementById('lista-voci');
                const listaIndicatori = document.getElementById('lista-indicatori');

                let optionsHtml = '<option value="" disabled selected>Seleziona l\'Indicatore</option>';
                indicatori.forEach(i => {
                    optionsHtml += `<option value="${i.nome}">${i.nome}</option>`;
                });

                if (voci.length === 0) {
                    listaVoci.innerHTML = "<p class='text-muted'>Nessuna voce.</p>";
                } else {
                    listaVoci.innerHTML = voci.map(v => `
                        <div class="card mb-1 p-2 shadow-sm border-success mx-auto" style="border-radius: 20px;">
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="ms-2 text-start">
                                    <strong>${v.nome}</strong>
                                    <p>${v.descrizione_testuale}</p>
                                </div>
                                
                                <select name="esg[${v.nome}][indicatore]" class="form-select bg-light border-1 rounded-pill" style="max-width: 250px;">
                                    ${optionsHtml}
                                </select>
                                
                                <input type="number" step="0.01" class="form-control bg-light border-1 rounded-pill ms-auto" style="max-width: 150px;" name="esg[${v.nome}][valore]" placeholder="Inserisci Valore">
                                <input type="text" class="form-control bg-light border-1 rounded-pill ms-auto" style="max-width: 150px;" name="esg[${v.nome}][fonte]" placeholder="Inserisci Fonte">
                                <input type="date" class="form-control bg-light border-1 rounded-pill ms-auto" style="max-width: 150px;" name="esg[${v.nome}][data]">
                            </div>
                        </div>
                    `).join('');
                }

                if (indicatori.length === 0) {
                    listaIndicatori.innerHTML = "<p class='text-muted'>Nessun Indicatore.</p>";
                } else {
                    listaIndicatori.innerHTML = indicatori.map(i => {
                        let dettagli = "";
                        if (i.tipo === "ambientali") {
                            dettagli = `<p>Codice Normativa: ${i.codice_normativa}</p>`;
                        } else if (i.tipo === "sociali") {
                            dettagli = `
                            <p class="mb-0">Ambito Sociale: ${i.ambito_sociale}</p>
                            <p>Frequenza Rilevazione: ${i.frequenza_rilevazione}</p>`;
                        }
                        return `
                            <div class="card mb-1 p-2 shadow-sm border-success mx-auto" style="border-radius: 20px;">
                                <div class="d-flex justify-content-between align-items-center">
                                    <div class="ms-2 text-start">
                                        <strong>${i.nome}</strong>
                                        <p class="mb-0">Tipologia: ${i.tipo}</p>
                                        <p class="mb-0">Rilevanza: ${i.rilevanza}</p>
                                        ${dettagli}
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('');
                }
            })
            .catch(error => console.error('Errore:', error));
        </script>
    </body>
</html>
