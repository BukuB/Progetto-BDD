<!DOCTYPE html>
<html>
     <head>
        <meta charset="UTF-8">
        <title>A.L_admin</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
            </div>
            </div>
        </header>
        <main class="align-items-center text-center">
            <h3 class="mt-3">Associa un Revisore ESG ai Bilanci</h3>
            <div id="container-bilancio">
    
                <form id="formBilancio" action="associa_revisore_bilancio.php" method="POST">
                    <div id="lista-bilanci" class="mt-3">
                        
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-25 d-block mx-auto rounded-pill fw-bold">Invia</button>
                </form>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            Promise.all([
                fetch('get_bilancio.php').then(res => res.json()),
                fetch('get_revisori_esg.php').then(res => res.json())
            ])
            .then(([bilanci, revisori]) => {
                const listaBilanci = document.getElementById('lista-bilanci');
                const listaRevisori = document.getElementById('lista-revisori');

                let optionsHtml = '<option value="" disabled selected>Seleziona il Revisore Esg</option>';
                revisori.forEach(r => {
                optionsHtml += `<option value="${r.cf}">${r.username}</option>`; 
                });
                if (bilanci.length === 0) {
                    listaBilanci.innerHTML = "<p class='text-muted'>Nessun bilancio nel database.</p>";
                    return;
                }
                listaBilanci.innerHTML = bilanci.map(b => `
                    <div class="card mb-2 p-3 shadow-sm border-success mx-auto" style="border-radius: 20px; max-width: 600px;">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="text-start">
                                <strong>Id: ${b.id}</strong>
                                <p class="mb-0">Data Creazione: ${b.data_creazione}</p>
                                <p class="mb-0">Stato: ${b.stato}</p>
                                <p class="mb-0">Partita Iva: ${b.partita_iva}</p>
                            </div>
                            <select name="esg[${b.id}][revisore]" class="form-select bg-light border-1 rounded-pill" style="max-width: 250px;">
                                    ${optionsHtml}
                            </select>
                        </div>
                    </div>
                `).join('');
            })
            .catch(error => console.error('Errore Lista Bilanci:', error));
        </script>
    </body>
</html>
