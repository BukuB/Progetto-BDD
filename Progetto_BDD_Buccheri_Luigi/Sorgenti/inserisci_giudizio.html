<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Giudizio Complessivo - ESG</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <header>
        <div class="bg-white shadow-sm py-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" height="55">
                </a>
            </div>
        </div>
    </header>

    <main class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-7 text-center">
                <h3>Emetti Giudizio Complessivo</h3>
                <p class="text-muted">Seleziona il bilancio e definisci l'esito finale della revisione.</p>

                <form action="salva_giudizio.php" method="POST" class="mt-4">
                    <div class="bg-white p-5 shadow" style="border-radius: 30px;">
                        
                        <div class="mb-4 text-start">
                            <label class="form-label text-muted small fw-bold">Bilancio Assegnato</label>
                            <select name="id_bilancio" id="id_bilancio" class="form-select bg-light border-0 rounded-pill" required>
                                <option value="" disabled selected>Caricamento bilanci...</option>
                            </select>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label text-muted small fw-bold">Esito Finale</label>
                            <select name="esito" class="form-select bg-light border-0 rounded-pill" required>
                                <option value="" disabled selected>Scegli l'esito...</option>
                                <option value="approvazione">Approvazione</option>
                                <option value="approvazione con rilievi">Approvazione con rilievi</option>
                                <option value="respingimento">Respingimento</option>
                            </select>
                        </div>

                        <div class="row mb-4 text-start">
                            <div class="col-md-6">
                                <label class="form-label text-muted small fw-bold">Data Giudizio</label>
                                <input type="date" name="data" class="form-control bg-light border-0 rounded-pill" required>
                            </div>
                        </div>

                        <div class="mb-4 text-start">
                            <label class="form-label text-muted small fw-bold">Campo Rilievi (Opzionale)</label>
                            <textarea name="rilievi" class="form-control bg-light border-0" style="border-radius: 15px;" rows="4" placeholder="Inserisci qui eventuali rilievi tecnici..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-dark btn-lg w-50 rounded-pill fw-bold shadow">Invia Giudizio</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        fetch('get_bilanci_assegnati.php')
            .then(res => res.json())
            .then(bilanci => {
                const select = document.getElementById('id_bilancio');
                let options = '<option value="" disabled selected>Seleziona Bilancio</option>';
                bilanci.forEach(id => { options += `<option value="${id}">Bilancio ID: ${id}</option>`; });
                select.innerHTML = options;
            });
    </script>
</body>
</html>
