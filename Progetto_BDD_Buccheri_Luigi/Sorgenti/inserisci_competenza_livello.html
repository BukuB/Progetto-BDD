<!DOCTYPE html>
<html>
     <head>
        <meta charset="UTF-8">
        <title>A.L_Revisore ESG</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
                </div>
            </div>
        </header>
        <main class="align-items-center">
            <div class="text-center align-items-center mt-3">
                <h3>Inserisci le tue Competenze e il Livello</h3>
                <h6>Se la tua competenza è già presente nella lista, associa un livello. Altrimenti, inseriscine una nuova!</h6>
            </div>
            
            <div class="px-5 mt-5">
                <div class="row gx-5 justify-content-center">
                    
                    <div class="col-md-5 mb-4 me-3 text-center">
                        <h4>Lista Competenze</h4>
                        
                        <form action="salva_livello_competenza.php" method="POST">
                            <div id="lista-competenze" class="text-start">
                                </div>
                            <button type="submit" class="btn btn-dark btn-lg mt-4 w-50 d-block mx-auto rounded-pill fw-bold">Salva Livelli</button>
                        </form>
                    </div>

                    <div class="col-md-5 mb-4 ms-3 text-center">
                        <h4>Inserisci la tua Competenza</h4>
                        
                        <form action="inserisci_competenza_livello.php" method="POST">
                            <div class="bg-white p-5 shadow w-100" style="border-radius: 30px;">
                                
                                <div class="mb-3 text-start">
                                    <label class="form-label text-muted small fw-bold">Nome Competenza</label>
                                    <input type="text" class="form-control form-control-lg bg-light border-0 rounded-pill mb-3" name="competenza" placeholder="es: Valutazione Rischio Ambientale" required>
                                    
                                    <label class="form-label text-muted small fw-bold">Livello (da 0 a 5)</label>
                                    <input type="number" min="0" max="5" class="form-control form-control-lg bg-light border-0 rounded-pill" name="livello" placeholder="es: 4" required>
                                </div>
                                
                                <button type="submit" class="btn btn-dark btn-lg mt-4 w-50 d-block mx-auto rounded-pill fw-bold">Aggiungi</button>
                            </div>
                        </form>
                    </div>
                    
                </div>
            </div>
        </main>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            fetch('get_competenze.php') 
            .then(res => res.json())
            .then(competenze => {
                const listaCompetenze = document.getElementById('lista-competenze');
                
                if (competenze.length === 0) {
                    listaCompetenze.innerHTML = "<p class='text-muted text-center'>Nessuna Competenza nel database.</p>";
                    return;
                }
                
                listaCompetenze.innerHTML = competenze.map(c => {
                    let badge = '';
                    let valorePrecompilato = '';

                    if (c.livello !== null) {
                        badge = `<span class="badge bg-success ms-2">Già tua (Livello: ${c.livello})</span>`;
                        valorePrecompilato = `value="${c.livello}"`;
                    }

                    return `
                    <div class="card mb-2 p-3 shadow-sm ${c.livello !== null ? 'border-success' : 'border-secondary'}" style="border-radius: 20px;">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${c.nome}</strong> ${badge}
                            </div>
                            <input type="number" min="0" max="5" class="form-control bg-light border-1 rounded-pill ms-auto" style="max-width: 150px;" name="livelli[${c.nome}]" placeholder="Livello (0-5)" ${valorePrecompilato}>
                        </div>
                    </div>
                    `;
                }).join('');
            })
            .catch(error => console.error('Errore nel caricamento competenze:', error));
        </script>
    </body>
</html>
