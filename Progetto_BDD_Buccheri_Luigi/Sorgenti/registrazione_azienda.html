<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Register_Azienda-ESG BALANCE</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="register.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <!--logo-->
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
            </div>
            </div>
        </header>
        <main class="d-flex align-items-center justify-content-center bg-light">
            
            <div class="bg-white p-5 shadow rounded-4 w-100" style="max-width: 1000px;">
                
                <h3 class="text-center mb-4 fw-bold">Inserisci i dati dell'azienda</h3>
                
                <form action="registrazione_azienda.php" method="POST" enctype="multipart/form-data">
                    <div class="row gx-5">
                        <div class="col-md-6 mb-4">
                            <div class="mb-3">
                                <label for="nome-azienda" class="form-label text-muted small fw-bold">Nome Azienda</label>
                                <input type="text" class="form-control form-control-lg bg-light border-0 rounded-pill" id="nome-azienda" name="nome-azienda" required>
                            </div>
                            <div class="mb-3">
                                <label class="block text-muted small fw-bold uppercase ms-2">Ragione Sociale</label>
                                <select id="ragione-sociale" name="ragione-sociale" class="form-select bg-light border-1 rounded-pill" required>
                                    <option value="" disabled selected>Seleziona la Ragione Sociale</option>
                                    <option value="spa">S.p.A. (Società per Azioni)</option>
                                    <option value="srl">S.r.l. (Società a Responsabilità Limitata)</option>
                                    <option value="snc">S.n.c. (Società in Nome Collettivo)</option>
                                    <option value="sas">S.a.s. (Società in Accomandita Semplice)</option>
                                    <option value="sapa">S.A.P.A. (Società in Accomandita per Azioni)</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="block text-muted small fw-bold uppercase ms-2">Ragione Sociale</label>
                                <select id="settore" name="settore" class="form-select bg-light border-1 rounded-pill" required>
                                    <option value="" disabled selected>Settore</option>
                                    <option value="agr_pesc">Agricoltura e Pesca</option>
                                    <option value="man_ind">Manifatturiero / Industria</option>
                                    <option value="ed_cost">Edilizia e Costruzioni</option>
                                    <option value="commercio">Commercio (Ingrosso e Dettaglio)</option>
                                    <option value="serv">Servizi Finanziari e Assicurativi</option>
                                    <option value="it">IT, Tecnologia e Telecomunicazioni</option>
                                    <option value="san_ass">Sanità e Assistenza</option>
                                    <option value="trasp_log">Trasporti e Logistica</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6 mb-4">
                            <div class="mb-3">
                                <label for="partita-iva" class="form-label text-muted small fw-bold">Partita Iva</label>
                                <input type="text" class="form-control form-control-lg bg-light border-0 rounded-pill" id="partita-iva" name="partita-iva" required>
                            </div>
                            <div class="mb-3">
                                <label for="numero-dipendenti" class="form-label text-muted small fw-bold">Numero Dipendenti</label>
                                <input type="text" class="form-control form-control-lg bg-light border-0 rounded-pill" id="numero-dipendenti" name="numero-dipendenti" required>
                            </div>
                            <label class="form-label text-muted small fw-bold">Inserire Logo</label>
                            <div class="form-group">
                                <input type="file" class="form-control-file" id="logo" name="logo" accept=".jpg" required>
                            </div>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-dark btn-lg w-25 d-block mx-auto rounded-pill fw-bold">Registra Azienda</button>
                </form>
            </div>

        </main>
    </body>
</html>
