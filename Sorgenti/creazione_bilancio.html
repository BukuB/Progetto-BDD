<!DOCTYPE html>
<html>
     <head>
        <meta charset="UTF-8">
        <title>A.L_responsabile_aziendale_creazione_bilancio</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
            </div>
            </div>
        </header>
        <main class="align-items-center text-center">
            <h3 class="mt-3">Crea Nuovo Bilancio</h3>
            <div id="container-bilancio">
    
                <form id="formBilancio" action="aggiungi_valore_voce.php" method="POST">
                    <div class="d-flex justify-content-center align-items-center mt-4 mb-4">
                        <label for="partita_iva" class="me-2">Partita IVA Azienda:</label>
                        <input type="text" id="partita_iva" name="partita_iva" class="form-control bg-light border-1 rounded-pill" style="max-width: 200px;" required>
                    </div>
                    <div id="lista-voci" class="mt-3">
                    
                    </div>
                    
                    <button type="submit" class="btn btn-dark btn-lg w-25 d-block mx-auto rounded-pill fw-bold">Crea e Popola il Bilancio</button>
                </form>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            fetch('get_voci_contabili.php') 
            .then(res => res.json())
            .then(voci => {
                const listaVoci = document.getElementById('lista-voci');
                if (voci.length === 0) {
                    listaVoci.innerHTML = "<p class='text-muted'>Nessuna voce.</p>";
                    return;
                }
                listaVoci.innerHTML = voci.map(v => `
                    <div class="card mb-1 p-2 shadow-sm border-success mx-auto" style="border-radius: 20px; width: 800px;">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="ms-2 text-start">
                                <strong>${v.nome}</strong>
                                <p>${v.descrizione_testuale}</p>
                            </div>
                            <input type="number" class="form-control bg-light border-1 rounded-pill ms-auto" style="max-width: 200px;" name="voci[${v.nome}]" placeholder="Inserisci valore">
                        </div>
                    </div>
                `).join('');
            })
            .catch(error => console.error('Errore Lista:', error));
        </script>
    </body>
</html>
