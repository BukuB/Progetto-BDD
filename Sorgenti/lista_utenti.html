<!DOCTYPE html>
<html>
     <head>
        <meta charset="UTF-8">
        <title>A.L_admin_lista_utenti</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
            </div>
            </div>
        </header>
        <main class="bg-light d-flex align-items-center" style="min-height: 85vh;">
            
            <div class="container-fluid">
                <div class="row w-100">
                    
                    <div class="col-md-6 mb-4 px-5">
                        <h4 class="mt-4 mb-4 fw-bold text-petrolio">Utenti</h4>
                        
                        <div id="lista-utenti-accettati">
                            </div>
                    </div>
                    
                    <div class="col-md-6 mb-4 d-flex align-items-center justify-content-center">
                        
                        <div id="lista-dati-utente" class="bg-white shadow w-100 p-4 mx-4" style="border-radius: 20px;">
                            <p class="text-center text-muted m-0">Seleziona un utente a sinistra per vederne i dettagli.</p>
                        </div>
                        
                    </div>
                    
                </div>
            </div>

        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>

        function visualizzaUtente(username) {
            const dati = new FormData();
            dati.append('username', username);

            fetch('get_dettagli_utente.php', {
                method: 'POST',
                body: dati
            })
            .then(response => response.json())
            .then(data => {
                
                if (data.successo === true) {
                    const contenitoreDati = document.getElementById('lista-dati-utente');
                    
                    contenitoreDati.innerHTML = `
                    <h4 class="mb-4 fw-bold text-petrolio">Profilo: ${data.username}</h4>
                    <div class="text-start fs-5">
                        <p><strong>Email:</strong> ${data.indirizzo_email}</p>
                        <p><strong>Codice Fiscale:</strong> ${data.cf}</p>
                        <p><strong>Data nascita:</strong> ${data.data_nascita}</p>
                        <p><strong>Luogo nascita:</strong> ${data.luogo_nascita}</p>
                        <p><strong>Professione:</strong> ${data.professione}</p>
                        <div class="text-center mt-4">
                            <button type="button" class="btn btn-danger btn-lg rounded-pill px-5" onclick="eliminaUtente('${data.username}')">
                                Elimina Utente
                            </button>
                        </div>
                    </div>
                `;
                } else {
                    alert("Errore: " + data.messaggio);
                }
            })
            .catch(error => console.error('Errore JS:', error));
        }

        fetch('get_utente_accettato.php') 
            .then(res => res.json())
            .then(approvati => {
                const listaApprovati = document.getElementById('lista-utenti-accettati');
                if (approvati.length === 0) {
                    listaApprovati.innerHTML = "<p class='text-muted'>Nessun utente approvato.</p>";
                    return;
                }
                listaApprovati.innerHTML = approvati.map(u => `
                    <div class="card mb-2 p-3 shadow-sm border-success" style="border-radius: 20px;">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${u.username}</strong><br>
                            </div>
                            <button type="button" class="btn btn-petrolio btn-sm" onclick="visualizzaUtente('${u.username}')">
                            Visualizza Dati
                            </button>
                        </div>
                    </div>
                `).join('');
            })
            .catch(error => console.error('Errore Lista 2:', error));

        function eliminaUtente(username) {
            if (confirm(`Sei sicuro di voler eliminare l'utente ${username}?`)) {
                const dati = new FormData();
                dati.append('username', username);

                fetch('elimina_utente.php', {
                    method: 'POST',
                    body: dati
                })
                .then(res => res.text())
                .then(risposta => {
                    alert(risposta); 
                    location.reload(); 
                })
                .catch(error => console.error('Errore durante l\'eliminazione:', error));
            }
        }
        </script>
    </body>
</html>
