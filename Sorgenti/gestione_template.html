<!DOCTYPE html>
<html>
     <head>
        <meta charset="UTF-8">
        <title>A.L_admin_creazione_template</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
            </div>
            </div>
        </header>
        <main class="bg-light d-flex align-items-center" style="min-height: 85vh;">
            <div class="container-fluid px-5"> 
                
                <div class="row w-100 justify-content-evenly align-items-start mt-5"> 
                    
                    <div class="col-md-5 mb-4 bg-white shadow p-5" style="border-radius: 20px;">
                        
                        <form id="form-voce" action="aggiungi_voce.php" method="POST">
                            <label for="nome_voce" class="form-label text-muted fw-bold">Nome Voce Contabile</label>
                            <input type="text" class="form-control form-control-lg mx-auto bg-light border border-dark rounded-pill mb-3" id="nome_voce" name="nome_voce" placeholder="es. Ricavi delle vendite" required>
                            
                            <label for="descrizione_voce" class="form-label text-muted fw-bold">Descrizione</label>
                            <textarea class="form-control mx-auto bg-light border border-dark mb-4" id="descrizione_voce" name="descrizione_voce" rows="3" style="border-radius: 15px;" placeholder="Inserisci una breve descrizione..." required></textarea>
                            
                            <button type="submit" class="btn btn-dark btn-lg w-75 d-block mx-auto rounded-pill fw-bold mb-0">Aggiungi al Template</button>
                        </form>
                        
                    </div>
                    
                    <div class="col-md-5 mb-4">
                        <h4 class="fw-bold text-petrolio mb-4 text-center">Lista Indicatori</h4>
                        <div id="lista-voci">

                        </div>
                    </div>
                    
                </div>
            </div>
        </main>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
        <script>
            fetch('get_voci_contabili.php') 
            .then(res => res.json())
            .then(voci => {
                const listaVoci = document.getElementById('lista-voci');
                if (voci.length === 0) {
                    listaVoci.innerHTML = "<p class='text-muted'>Nessuna voce.</p>";
                    return;
                }
                listaVoci.innerHTML = voci.map(v => `
                    <div class="card mb-1 p-2 shadow-sm border-success" style="border-radius: 20px;">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="ms-2">
                                <strong>${v.nome}</strong>
                                <p>${v.descrizione_testuale}</p>
                            </div>
                            <button type="button" class="btn btn-danger btn-sm rounded-pill px-3 py-1 text-nowrap" onclick="eliminaVoce('${v.nome}')">
                                Rimuovi Voce
                            </button>
                        </div>
                    </div>
                `).join('');
            })
            .catch(error => console.error('Errore Lista:', error));

            function eliminaVoce(nome) {
                if (confirm(`Sei sicuro di voler eliminare la voce ${nome}?`)) {
                    const dati = new FormData();
                    dati.append('nome', nome);

                    fetch('elimina_voce.php', {
                        method: 'POST',
                        body: dati
                    })
                    .then(res => res.text()) 
                    .then(risposta => {
                        alert(risposta); 
                        location.reload(); 
                    })
                    .catch(error => console.error('Errore durante l\'eliminazione:', error));
                }
            }
        </script>
    </body>
</html>
