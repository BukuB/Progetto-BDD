<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Statistiche-ESG BALANCE</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="register.css">

        <link rel="stylesheet" href="css.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <!--logo-->
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
                </div>
            </div>
        </header>
        <main class="d-flex align-items-center justify-content-center bg-light">
            <!-- SEZIONE STATISTICHE -->
<div class="container mt-5 mb-5">
    <h3 class="mb-4">Statistiche della Piattaforma</h3>
    
    <div class="row g-4">
        <!-- Stat 1: Aziende Registrate -->
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body">
                    <h6 class="card-title">Aziende Registrate</h6>
                    <h2 id="stat-aziende">...</h2>
                </div>
            </div>
        </div>
        
        <!-- Stat 2: Revisori ESG -->
        <div class="col-md-3">
            <div class="card h-100">
                <div class="card-body">
                    <h6 class="card-title">Revisori ESG</h6>
                    <h2 id="stat-revisori">...</h2>
                </div>
            </div>
        </div>
        
        <!-- Stat 3: Azienda più affidabile -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-body">
                    <h6 class="card-title">Azienda più Affidabile</h6>
                    <h3 id="stat-top-azienda">Caricamento...</h3>
                    <p id="stat-top-affidabilita">Tasso di bilanci senza rilievi: ...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Stat 4: Classifica Bilanci -->
    <div class="row mt-4">
        <div class="col-12">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title mb-3">Classifica Bilanci (Indicatori ESG)</h5>
                    <ul class="list-group" id="stat-classifica">
                        <li class="list-group-item">Caricamento classifica in corso...</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
        </main>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    
    fetch('get_statistiche.php')
        .then(response => response.json())
        .then(dati => {
            
            document.getElementById('stat-aziende').innerText = dati.totale_aziende;
            document.getElementById('stat-revisori').innerText = dati.totale_revisori;
            
            document.getElementById('stat-top-azienda').innerText = dati.azienda_top.nome;
            document.getElementById('stat-top-affidabilita').innerText = `Approvazioni nette: ${dati.azienda_top.percentuale}%`;

            const containerClassifica = document.getElementById('stat-classifica');
            if (dati.classifica.length === 0) {
                containerClassifica.innerHTML = '<li class="list-group-item">Nessun bilancio valutato finora.</li>';
            } else {
                containerClassifica.innerHTML = dati.classifica.map((item, index) => `
                    <li class="list-group-item d-flex justify-content-between align-items-center py-3 border-bottom">
                        <span><strong>#${index + 1}</strong> ${item.nome_azienda} <span class="text-muted">(Bilancio ID: ${item.id_bilancio})</span></span>
                        <span class="badge btn-petrolio rounded-pill px-3 py-2">${item.totale_indicatori} indicatori</span>
                    </li>
                `).join('');
            }
        })
        .catch(error => console.error('Errore di connessione:', error));
    </script>
</body> 
</html>
