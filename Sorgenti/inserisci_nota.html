<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>A.L_Revisore - Note</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <header>
        <div class="bg-white shadow-sm py-3">
            <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="Logo" height="55">
                </a>
            </div>
        </div>
    </header>

    <main class="container mt-4">
        <div class="text-center">
            <h3>Valutazione Voci Contabili</h3>
            <p class="text-muted">Seleziona un bilancio tra quelli assegnati e inserisci le tue note professionali.</p>

            <form id="formBilancio" action="aggiungi_nota_voce.php" method="POST">
                
                <div class="d-flex justify-content-center align-items-center mb-5 mt-4">
                    <label for="id_bilancio" class="fw-bold me-3">Bilancio da revisionare:</label>
                    <select id="id_bilancio" name="id_bilancio" class="form-select bg-light border-1 rounded-pill" style="max-width: 300px;" required>
                        <option value="" disabled selected>Caricamento bilanci...</option>
                    </select>
                </div>

                <div id="lista-voci-contabili">
                    </div>

                <button type="submit" class="btn btn-dark btn-lg w-25 mt-4 d-block mx-auto rounded-pill fw-bold shadow mb-5">Invia Note</button>
            </form>
        </div>
    </main>

    <script>
        fetch('get_bilanci_assegnati.php')
            .then(res => res.json())
            .then(bilanci => {
                const select = document.getElementById('id_bilancio');
                if (bilanci.length === 0) {
                    select.innerHTML = '<option value="">Nessun bilancio assegnato</option>';
                    return;
                }
                
                let options = '<option value="" disabled selected>Seleziona ID Bilancio</option>';
                bilanci.forEach(id => {
                    options += `<option value="${id}">Bilancio ID: ${id}</option>`;
                });
                select.innerHTML = options;
            });

        fetch('get_voci_contabili.php')
            .then(res => res.json())
            .then(voci => {
                const listaVoci = document.getElementById('lista-voci-contabili');
                if (voci.length === 0) {
                    listaVoci.innerHTML = "<p class='text-muted'>Nessuna voce contabile trovata.</p>";
                    return;
                }
                
                listaVoci.innerHTML = voci.map(v => `
                    <div class="card mb-2 p-3 shadow-sm border-success mx-auto" style="border-radius: 20px; max-width: 900px;">
                        <div class="d-flex justify-content-between align-items-center">
                            <div class="text-start w-50">
                                <h6 class="fw-bold mb-1">${v.nome}</h6>
                                <p class="text-muted small mb-0">${v.descrizione_testuale}</p>
                            </div>
                            
                            <div class="d-flex gap-2 align-items-center">
                                <div>
                                    <input type="date" class="form-control bg-light border-1 rounded-pill" name="esg[${v.nome}][data]" required>
                                </div>
                                <div>
                                    <textarea class="form-control bg-light border-1" 
                                              style="width: 250px; border-radius: 15px; font-size: 0.9rem;" 
                                              name="esg[${v.nome}][nota]" 
                                              rows="2" 
                                              placeholder="Rilievi..."></textarea>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            });
    </script>
</body>
</html>
