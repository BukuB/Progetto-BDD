<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>Login-ESG BALANCE</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="login.css">
    </head>
    <body>
        <header>
            <div class="bg-white shadow-sm py-3 position-relative">
                <div class="container-fluid">
                <a class="navbar-brand" href="index.html">
                    <img src="src/logo.png" alt="ESG-BALANCE Logo" height="55">
                </a>
            </div>
            </div>
        </header>
        <main class="d-flex align-items-center justify-content-center bg-light" style="min-height: 80vh;">
            
            <div class="bg-white p-5 shadow rounded-4" style="width: 100%; max-width: 400px;">
                
                <h3 class="text-center mb-4 fw-bold">Accedi</h3>
                
                <form action="login.php" id="form-login" method="POST">
                    
                    <div class="mb-3">
                        <label for="username" class="form-label text-muted small fw-bold">Username</label>
                        
                        <div id="errore-username" class="text-danger mb-1 small" style="display: none; font-weight: bold;">
                            Username non trovato!
                        </div>
                        
                        <input type="text" class="form-control form-control-lg bg-light border-0 rounded-pill" id="username" name="username" placeholder="es: umberto123" required>
                    </div>
                    
                    <div class="mb-4">
                        <label for="password" class="form-label text-muted small fw-bold">Password</label>
                        
                        <div id="errore-password" class="text-danger mb-1 small" style="display: none; font-weight: bold;">
                            Password errata!
                        </div>
                        
                        <input type="password" class="form-control form-control-lg bg-light border-0 rounded-pill" id="password" name="password" placeholder="••••••••••••" required>
                    </div>
                    
                    <button type="submit" class="btn btn-dark btn-lg w-100 rounded-pill fw-bold">Entra</button>
                </form>
                
                <div class="text-center mt-4">
                    <p class="text-muted">Non hai ancora un account?<br><a class="nav-link text-decoration-none text-petrolio fw-bold" href="register.html">Crealo adesso.</a></p>
                </div>
            </div>

        </main>
        
        <script>
        document.getElementById('form-login').addEventListener('submit', function(evento) {
            evento.preventDefault(); 

            document.getElementById('errore-username').style.display = 'none';
            document.getElementById('errore-password').style.display = 'none';

            const datiForm = new FormData(this);

            fetch('login.php', {
                method: 'POST',
                body: datiForm
            })
            .then(risposta => risposta.json()) 
            .then(dati => {
                if (dati.successo === true) {
                    window.location.href = 'index.html'; 
                } else {
                    if (dati.tipo_errore === 'username') {
                        document.getElementById('errore-username').style.display = 'block';
                    } else if (dati.tipo_errore === 'password') {
                        document.getElementById('errore-password').style.display = 'block';
                    }
                }
            })
            .catch(errore => console.error("Errore di connessione:", errore));
        });
        </script>
    </body>
</html>
